name: 버그 신고
description: 문서와 다르게 동작하는 경우
title: "[버그] "
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: 버전
      description: "@cp949/random 버전과 subpath(예: 0.1.1, @cp949/random/id)"
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 재현 코드
      description: 그대로 실행할 수 있는 최소 코드
      render: ts
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 예상 결과와 실제 결과
      description: 예상 결과의 근거가 되는 문서(docs/api 등)가 있으면 함께 적는다.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 실행 환경
      description: "브라우저·버전, Worker 여부, 번들러, TypeScript 버전"
    validations:
      required: true

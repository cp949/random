name: Release

# v* 태그 push에서 @cp949/random을 npm에 배포한다.
# npm 토큰 없이 trusted publishing(OIDC)으로 인증한다. npmjs.com 패키지 설정의 trusted publisher에
# 저장소 cp949/random과 이 파일명(release.yml)이 등록돼 있어야 한다. 파일명을 바꾸면 등록도 바꾼다.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          # main 포함 여부를 확인하려면 전체 이력이 필요하다.
          fetch-depth: 0
      # pnpm 버전은 package.json의 packageManager 필드를 따른다.
      - uses: pnpm/action-setup@v6
      # trusted publishing은 npm CLI 11.5.1 이상이 필요하다. Node 24에 번들된 npm을 쓴다.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # main에 병합되지 않은 커밋의 태그는 배포하지 않는다.
      - run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      # 태그와 package.json 버전이 다르면 배포하지 않는다.
      - run: test "$GITHUB_REF_NAME" = "v$(node -p "require('./packages/random/package.json').version")"
      - run: pnpm verify
      # verify 안에 dist를 지우고 다시 만드는 테스트가 있어(TRP-002) 배포할 dist를 다시 확정한다.
      - run: pnpm build --force
      - run: npm publish --provenance --access public
        working-directory: packages/random

packages:
  - "apps/*"
  - "packages/*"
# oxlint JS 플러그인(eslint-plugin-es-x)은 eslint를 peer로 선언하지만
# oxlint가 로드하므로 eslint를 설치하지 않는다.
autoInstallPeers: false
minimumReleaseAgeExclude:
  - '@oxlint-tsgolint/darwin-arm64@7.0.2007'
  - '@oxlint-tsgolint/darwin-x64@7.0.2007'
  - '@oxlint-tsgolint/linux-arm64@7.0.2007'
  - '@oxlint-tsgolint/linux-x64@7.0.2007'
  - '@oxlint-tsgolint/win32-arm64@7.0.2007'
  - '@oxlint-tsgolint/win32-x64@7.0.2007'
  - oxlint-tsgolint@7.0.2007
peerDependencyRules:
  ignoreMissing:
    - eslint
# pnpm audit 대응: 부모 패키지가 고정한 취약 전이 의존성을 패치 버전으로 올린다.
# 모두 개발 도구(stryker, release-it) 경로이며 배포 산출물에 포함되지 않는다.
overrides:
  basic-ftp: ^6.2.6
  qs: ^6.16.1
  "@stryker-mutator/core>minimatch": ^11.0.1
